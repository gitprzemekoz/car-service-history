name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Supabase CLI defaults to public.ecr.aws, which answers anonymous CI pulls with
  # "toomanyrequests: Data limit exceeded" and only then falls back to GHCR. Anonymous
  # GHCR pulls share a per-IP limit across hosted runners, so each job logs in first.
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start local Supabase
        run: |
          # The CLI's own pull retries fire microseconds apart; back off between whole attempts.
          for i in 1 2 3; do
            supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 30))
          done
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - name: RLS visibility matrix (DB integration)
        run: npm run test:db -- --reporter=verbose
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - name: Dashboard HTTP integration against production preview
        run: BASE_URL=http://localhost:4321 npm run test:http -- --reporter=verbose
      - if: always()
        run: supabase stop --no-backup

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Separate job: its own Supabase instance keeps the local auth rate limit
    # (30 sign-ups/sign-ins per 5 min) apart from `smoke`, and Playwright's
    # webServer owns port 4321 here. Credentials are the seeded local account
    # from supabase/seed.sql, valid only inside this runner.
    env:
      E2E_USERNAME: mechanic@example.test
      E2E_PASSWORD: password123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      # No --with-deps: ubuntu-latest already ships Chrome's system libraries, and the apt
      # mirror it would download from can stall for minutes (context/changes/e2e-ci-timeouts).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start local Supabase
        run: |
          # The CLI's own pull retries fire microseconds apart; back off between whole attempts.
          for i in 1 2 3; do
            supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 30))
          done
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - name: E2E (Playwright builds and previews the app)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
